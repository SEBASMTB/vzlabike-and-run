<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: sans-serif; background: #f8f8f8; }
  .wrap { display: flex; flex-direction: column; gap: 40px; padding: 24px; }
  .container { margin: 0 auto; }
  .c3 { width: 1280px; }
  .c2 { width: 752px; }
  .grid { display: grid; gap: 24px; }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .g2 { grid-template-columns: repeat(2, 1fr); }
  .card { position: relative; background: #fff; border-radius: 16px; overflow: hidden; border: 1px solid #e5e5e5; }
  .imgbox { position: relative; height: 176px; overflow: hidden; }
  .imgbox img.photo { width: 100%; height: 100%; object-fit: cover; }
  .chip { position: absolute; bottom: 12px; right: 12px; z-index: 10; display: flex; align-items: center;
          background: rgba(26,26,46,0.9); border-radius: 8px; padding: 6px 12px; box-shadow: 0 1px 2px rgba(0,0,0,.15);
          outline: 1px solid rgba(255,255,255,0.1); }
  .chip img { height: 20px; width: auto; }
  .icon { position: absolute; bottom: -24px; left: 24px; width: 56px; height: 56px; border-radius: 12px;
          background: linear-gradient(135deg, #DC2626, #EF4444); display: flex; align-items: center; justify-content: center;
          color: #fff; font-size: 26px; box-shadow: 0 4px 8px rgba(0,0,0,.2); outline: 4px solid #fff; z-index: 5; }
  .body { padding: 36px 24px 24px; }
  h3 { margin: 0 0 8px; font-size: 20px; color: #111; }
  p { margin: 0; font-size: 14px; color: #555; line-height: 1.5; }
  .label { font-weight: bold; color: #333; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="container c3">
    <div class="label">Desktop 1280px — 3 columnas</div>
    <div class="grid g3" id="g-desktop"></div>
  </div>
  <div class="container c2">
    <div class="label">Tablet 752px — 2 columnas</div>
    <div class="grid g2" id="g-tablet"></div>
  </div>
</div>
<script>
const names = ["experiencia","creatividad","tecnologia","precision","adaptabilidad","compromiso"];
const titles = {experiencia:"Experiencia Organizativa", creatividad:"Creatividad", tecnologia:"Innovación Tecnológica",
  precision:"Organización al Milímetro", adaptabilidad:"Adaptabilidad", compromiso:"Compromiso Total"};
function card(n) {
  return `<div class="card">
    <div class="imgbox">
      <img class="photo" src="file:///home/z/my-project/public/features/${n}.webp">
      <div class="chip"><img src="file:///home/z/my-project/public/LOGOVBR.png"></div>
      <div class="icon">★</div>
    </div>
    <div class="body"><h3>${titles[n]}</h3><p>Descripción de la tarjeta de ejemplo para verificar el recorte y el chip del logo.</p></div>
  </div>`;
}
document.getElementById("g-desktop").innerHTML = names.map(card).join("");
document.getElementById("g-tablet").innerHTML = names.map(card).join("");
</script>
</body>
</html>
